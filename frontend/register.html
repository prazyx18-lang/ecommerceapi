<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account - ShopEasy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            ShopEasy
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p>
                Create your ShopEasy account
            </p>

            <button
                type="button"
                id="registerButton"
            >
                Create Account
            </button>

            <p id="registerMessage"></p>

            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>

    <script src="register.js"></script>

</body>

</html>
