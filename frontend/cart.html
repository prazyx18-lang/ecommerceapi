<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart - ShopEasy</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            ShopEasy
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="login.html">
                Login
            </a>

    <button
        id="logoutButton"
        style="display: none;"
    >
        Logout
    </button>


            <a href="cart.html" class="cart-btn">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>

        </nav>

    </header>


    <!-- CART -->

    <main class="cart-page">

        <h1>
            🛒 Your Cart
        </h1>


        <div id="cartItems">

            <p>
                Loading cart...
            </p>

        </div>


        <div class="cart-summary">

            <h2>
                Cart Summary
            </h2>

            <p>
                Total Items:
                <span id="totalItems">0</span>
            </p>

            <p>
                Total Price:
                ₹<span id="totalPrice">0.00</span>
            </p>


            <button
                id="placeOrderBtn"
                onclick="placeOrder()"
            >
                Place Order
            </button>

        </div>

    </main>


   <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>

<script src="auth.js"></script>

<script src="cart.js"></script>

</body>

</html>
